<!--
  index.html
  Página de entrada do Vite. Define o título, o ícone e a div #root,
  onde o React monta a aplicação (via src/main.tsx).
-->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- ícone da aba (arquivo em public/) -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulmoScope · Segmentação Pulmonar em TC</title>
  </head>
  <!-- cores de fundo e texto vêm do tema (theme/global.css) -->
  <body>
    <!-- ponto de montagem do React -->
    <div id="root"></div>
    <!-- carrega a aplicação -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
